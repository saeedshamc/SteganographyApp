name: open_stego_mobile
description: Open Stego Flutter client — same format as desktop/CLI via stego-ffi
publish_to: "none"
version: 0.4.1+41

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0B4F56"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_monochrome: assets/branding/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0B4F56"
  web:
    generate: false
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: false
