name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test -p stego-core -p stego-cli --locked
      - name: Clippy
        run: cargo clippy -p stego-core -p stego-cli -- -D warnings

  # Full NSIS/deb builds stay on scripts/ locally; CI keeps the core green.
